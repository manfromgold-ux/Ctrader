services:
  reef:
    build: .
    environment:
      REEF_DATA_DIR: /data
      REEF_ENV_FILE: /config/.env
    volumes:
      - ./data:/data
      # The whole folder, read-only, so Reef can read .env itself (tolerates Notepad's BOM and CRLF).
      # Mounting .env alone would make Docker create a *folder* named .env when the file is missing.
      # After editing .env run:  docker compose restart
      - ./:/config:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
