[project]
name = "reef"
version = "0.1.0"
description = "Autonomous fleet of paid web-data Actors on Apify Store: scout, build, heal, prune, report."
requires-python = ">=3.11"
dependencies = [
    "apify-client>=3.2,<4",
    "httpx>=0.27,<1",
    "parsel>=1.9,<2",
]

[project.optional-dependencies]
dev = [
    "apify>=4,<5",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
